[package]
name = "scrap-desktop-app"
version = "0.1.0"
authors = ["Radoslaw Madzia <radoslawmadzia@gmail.com>"]
edition = "2024"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
native-dialog = "0.7.0"
#i-slint-backend-winit = "1.3.2"
slint = "1.14.1"
chrono = "0.4.32"

repng = "0.2.2"

cpal = "0.16.0"
ffmpeg-next = "8.0.0" #{version = "8.0.0", features = ["build"]}
scap = "=0.1.0-beta.1"
smol = "2.0.2"
crossbeam-channel = "0.5.15"
rubato = "0.16.2"
serde = "1.0.228"
serde_json = "1.0.145"
ringbuf = "0.4.8"

dotenvy = "0.15.7"
reqwest = { version = "0.13", features = ["json", "form", "stream", "rustls", "multipart"] }
tokio = { version = "1", features = ["fs", "rt", "net", "time", "rt-multi-thread"] }
url = "2.5.8"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
webbrowser = "1.2.4"
uuid = {version = "1.25.0", features = ["v4", "serde"]}
tokio-util = "0.7.19"
futures = "0.3.34"



[build-dependencies]
#slint-build = "1.3.0"
slint-build = "1.14.1"

[patch.crates-io]
ffmpeg-next = {path = "src/crates/ffmpeg-next" }

[features]
experimental = []
deprecated = []
debug-info = []
audio-thread-debug-info = []
resampler-debug-info = []
audio-recorder-debug-info = []
muxer-debug-info = []
recording-session-debug-info = []
oauth-session-debug-info = []
debug-upload-file-read = []

#disable console
[profile.release]
lto = true
